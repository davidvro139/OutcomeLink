server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Evidence and import uploads are capped at 10 MB by the API; leave headroom for the multipart envelope.
  client_max_body_size 12m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # The API. The `api` host name is the compose service; nginx is one proxy hop in front of it (TRUST_PROXY=1).
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Large report exports can take a while to generate.
    proxy_read_timeout 120s;
  }

  location /health {
    proxy_pass http://api:4000;
  }

  # Hashed build assets never change under the same name.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Single-page app: any other path (including public survey and set-password links) is handled by the client router.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
